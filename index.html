<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 2rem;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            background: white;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        button.primary-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        button.primary-btn:hover {
            background: var(--primary-hover);
        }

        button.primary-btn:active {
            transform: scale(0.98);
        }

        .total-card {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 1rem;
            text-align: center;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .list-section {
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.02);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9375rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .category-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .cat-food {
            background: #fee2e2;
            color: #b91c1c;
        }

        .cat-travel {
            background: #e0f2fe;
            color: #0369a1;
        }

        .cat-shopping {
            background: #fef9c3;
            color: #a16207;
        }

        .cat-others {
            background: #f1f5f9;
            color: #475569;
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }

        .amount-cell {
            font-weight: 600;
            color: var(--text-main);
        }

        /* Micro-animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .expense-row {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Input Section -->
        <div class="card">
            <h1>💰 Tracker</h1>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="name">Expense Name</label>
                    <input type="text" id="name" placeholder="e.g., Starbucks Coffee" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <button type="submit" class="primary-btn">
                    <span>Add Expense</span>
                </button>
            </form>
        </div>

        <!-- Display Section -->
        <div class="card list-section">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <h1>📋 Expense History</h1>
                <div style="display: flex; gap: 1rem;">
                    <div
                        style="background: rgba(34, 197, 94, 0.1); padding: 0.75rem 1.25rem; border-radius: 1rem; text-align: right;">
                        <label
                            style="font-size: 0.75rem; color: #16a34a; font-weight: 700; text-transform: uppercase;">Today</label>
                        <div id="todayTotal" style="font-size: 1.25rem; font-weight: 800; color: #15803d;">$0.00</div>
                    </div>
                    <div
                        style="background: rgba(99, 102, 241, 0.1); padding: 0.75rem 1.25rem; border-radius: 1rem; text-align: right;">
                        <label
                            style="font-size: 0.75rem; color: var(--primary); font-weight: 700; text-transform: uppercase;">Overall</label>
                        <div id="totalAmount"
                            style="font-size: 1.25rem; font-weight: 800; color: var(--primary-hover);">$0.00</div>
                    </div>
                </div>
            </div>
            <div id="tableContainer">
                <table id="expenseTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="expenseList">
                        <!-- Expenses will be injected here -->
                    </tbody>
                </table>
                <div id="emptyMessage" class="empty-state">
                    No expenses recorded yet. Start tracking above!
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('expenseForm');
        const list = document.getElementById('expenseList');
        const totalDisplay = document.getElementById('totalAmount');
        const emptyMessage = document.getElementById('emptyMessage');
        const dateInput = document.getElementById('date');

        // Load data from localStorage on startup
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        // Set default date to today
        dateInput.valueAsDate = new Date();

        // Initial UI render
        updateUI();

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const expense = {
                id: Date.now(),
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                amount: parseFloat(document.getElementById('amount').value),
                date: document.getElementById('date').value
            };

            expenses.unshift(expense);
            saveData();
            updateUI();
            form.reset();
            dateInput.valueAsDate = new Date();
        });

        function saveData() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        function deleteExpense(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            saveData();
            updateUI();
        }

        function updateUI() {
            list.innerHTML = '';
            let totalOverall = 0;
            let totalToday = 0;
            const todayStr = new Date().toISOString().split('T')[0];

            if (expenses.length === 0) {
                emptyMessage.style.display = 'block';
                totalDisplay.textContent = `$0.00`;
                document.getElementById('todayTotal').textContent = `$0.00`;
                return;
            }

            emptyMessage.style.display = 'none';

            // Group expenses by date
            const grouped = expenses.reduce((groups, exp) => {
                const date = exp.date;
                if (!groups[date]) {
                    groups[date] = [];
                }
                groups[date].push(exp);
                return groups;
            }, {});

            // Sort dates descending
            const sortedDates = Object.keys(grouped).sort().reverse();

            sortedDates.forEach(date => {
                let dayTotal = 0;

                // Add a Date Header Row
                const headerRow = document.createElement('tr');
                headerRow.style.background = '#f1f5f9';
                headerRow.style.fontWeight = 'bold';
                headerRow.innerHTML = `
                    <td colspan="3" style="color: #475569; padding: 0.5rem 1rem;">📅 ${date === todayStr ? 'TODAY' : date}</td>
                    <td id="total-${date}" class="amount-cell" style="padding: 0.5rem 1rem; color: var(--primary);"></td>
                    <td></td>
                `;
                list.appendChild(headerRow);

                grouped[date].forEach(exp => {
                    dayTotal += exp.amount;
                    totalOverall += exp.amount;
                    if (date === todayStr) totalToday += exp.amount;

                    const row = document.createElement('tr');
                    row.className = 'expense-row';
                    const catClass = `cat-${exp.category.toLowerCase()}`;

                    row.innerHTML = `
                        <td style="color: var(--text-muted); font-size: 0.8rem;">${exp.date}</td>
                        <td>${exp.name}</td>
                        <td><span class="category-badge ${catClass}">${exp.category}</span></td>
                        <td class="amount-cell">$${exp.amount.toFixed(2)}</td>
                        <td style="text-align: right;">
                            <button onclick="deleteExpense(${exp.id})" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.2rem;" title="Delete">×</button>
                        </td>
                    `;
                    list.appendChild(row);
                });

                // Set the day total in the header
                document.getElementById(`total-${date}`).textContent = `$${dayTotal.toFixed(2)}`;
            });

            totalDisplay.textContent = `$${totalOverall.toFixed(2)}`;
            document.getElementById('todayTotal').textContent = `$${totalToday.toFixed(2)}`;
        }
    </script>
</body>

</html>
